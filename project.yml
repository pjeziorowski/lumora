# project.yml
# XcodeGen spec. Generate the Xcode project with:  xcodegen generate
name: Lumora
include:
  # App Store signing for the TestFlight workflow (.github/workflows/testflight.yml).
  # Left out unless LUMORA_APPSTORE_SIGNING=YES, so local builds keep automatic signing.
  - path: App/AppStoreSigning.yml
    enable: ${LUMORA_APPSTORE_SIGNING}
options:
  bundleIdPrefix: com.pjeziorowski
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
packages:
  AstroCore:
    path: Packages/AstroCore
  OpticsCore:
    path: Packages/OpticsCore
  GeoCore:
    path: Packages/GeoCore
  CameraCatalog:
    path: Packages/CameraCatalog
  PlannerKit:
    path: Packages/PlannerKit
targets:
  Lumora:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Shared
      - App/Resources
    entitlements:
      path: App/Lumora.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.pjeziorowski.lumora
    dependencies:
      - target: LumoraWidgets
      - package: AstroCore
      - package: GeoCore
      - package: PlannerKit
      - package: OpticsCore
      - package: CameraCatalog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pjeziorowski.lumora
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Lumora
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        # Only HTTPS to Apple and Open-Meteo, which is exempt from export compliance.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Lumora uses your location to compute Sun and Moon times where you are."
        INFOPLIST_KEY_NSCameraUsageDescription: "Lumora shows the camera view behind the Sun, Moon and Milky Way in AR."
        INFOPLIST_KEY_NSCalendarsWriteOnlyAccessUsageDescription: "Lumora adds your saved plans to your calendar when you ask it to."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
  LumoraWidgets:
    type: app-extension
    platform: iOS
    sources:
      - App/Widgets
      - App/Shared
      - App/Resources/Localizable.xcstrings
    entitlements:
      path: App/LumoraWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.pjeziorowski.lumora
    dependencies:
      - package: AstroCore
      - package: PlannerKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pjeziorowski.lumora.widgets
        INFOPLIST_FILE: App/Widgets/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  LumoraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - App/Tests
    dependencies:
      - target: Lumora
      - package: AstroCore
      - package: GeoCore
      - package: PlannerKit
      - package: OpticsCore
      - package: CameraCatalog
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  LumoraUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - App/UITests
    dependencies:
      - target: Lumora
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Lumora
schemes:
  Lumora:
    build:
      targets:
        Lumora: all
    test:
      gatherCoverageData: true
      targets:
        - LumoraTests
        - LumoraUITests
        - package: AstroCore/AstroCoreTests
        - package: OpticsCore/OpticsCoreTests
        - package: GeoCore/GeoCoreTests
        - package: CameraCatalog/CameraCatalogTests
        - package: PlannerKit/PlannerKitTests
