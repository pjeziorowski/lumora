# project.yml
# XcodeGen spec. Generate the Xcode project with:  xcodegen generate
name: Lumora
options:
  bundleIdPrefix: com.pjeziorowski
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
packages:
  AstroCore:
    path: Packages/AstroCore
  OpticsCore:
    path: Packages/OpticsCore
  GeoCore:
    path: Packages/GeoCore
  CameraCatalog:
    path: Packages/CameraCatalog
  PlannerKit:
    path: Packages/PlannerKit
targets:
  Lumora:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: AstroCore
      - package: PlannerKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pjeziorowski.lumora
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Lumora
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
  LumoraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - App/Tests
    dependencies:
      - target: Lumora
      - package: AstroCore
      - package: PlannerKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Lumora:
    build:
      targets:
        Lumora: all
    test:
      gatherCoverageData: true
      targets:
        - LumoraTests
        - package: AstroCore/AstroCoreTests
        - package: OpticsCore/OpticsCoreTests
        - package: GeoCore/GeoCoreTests
        - package: CameraCatalog/CameraCatalogTests
        - package: PlannerKit/PlannerKitTests
